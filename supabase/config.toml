# The application JWT is signed with application keys, not Supabase Auth keys.
# The handler performs its own verification and session-table lookup.
[functions.api]
verify_jwt = false

# Private email-verification worker authenticates with its Vault-held internal secret.
[functions.email-verification-worker]
verify_jwt = false

# Google Sheets outbox worker authenticates with a separate Vault-held secret.
[functions.google-sheets-worker]
verify_jwt = false
