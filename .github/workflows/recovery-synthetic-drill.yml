name: Synthetic encrypted recovery drill
on:
  push:
    branches:
      - test/production-recovery-gate
    paths:
      - '.github/workflows/recovery-synthetic-drill.yml'
      - 'docs/PRODUCTION_STATUS.md'
      - 'docs/production-recovery.md'
      - 'scripts/recovery/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-recovery
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.ref == 'refs/heads/test/production-recovery-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the approved synthetic test commit
        timeout-minutes: 1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check runner and run recovery unit tests
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          node --version
          node --test scripts/recovery/*.node-test.mjs
      - name: Install checksum-pinned age and pinned PostgreSQL image
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/al-recovery-tools-XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "$tool_dir/age.tar.gz"
          printf '%s  %s\n' bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 "$tool_dir/age.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/age.tar.gz" -C "$tool_dir" age/age age/age-keygen
          echo "$tool_dir/age" >> "$GITHUB_PATH"
          docker pull supabase/postgres@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
      - name: Run isolated synthetic encrypted backup and restore
        timeout-minutes: 11
        shell: bash
        run: node scripts/recovery/synthetic-drill.mjs
      - name: Independently verify temporary fixture cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          containers="$(docker ps -aq --filter label=adaptive-lifting.synthetic-recovery=true)"
          test -z "$containers"
          leftover_dir="$(find /tmp -maxdepth 1 -type d \( -name 'al-synthetic-recovery-*' -o -name 'adaptive-age-*' \) -print -quit)"
          test -z "$leftover_dir"
