name: Isolated recovery maintenance protocol checks

on:
  push:
    branches: [test/recovery-request-gate-2026-10-27]
    paths:
      - '.github/workflows/recovery-maintenance-synthetic.yml'
      - 'scripts/recovery/maintenance-*'
      - 'scripts/recovery/exclusive-maintenance*'
      - 'supabase/functions/_shared/recovery/**'
      - 'supabase/functions/_shared/db/mod.ts'
      - 'supabase/functions/*/index.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-maintenance-fault-drill
  cancel-in-progress: false

jobs:
  negative-controls:
    if: >-
      github.ref == 'refs/heads/test/recovery-request-gate-2026-10-27' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Verify secret-free probe and fault lifecycle checks
        timeout-minutes: 2
        run: node --test scripts/recovery/maintenance-readiness.node-test.mjs scripts/recovery/maintenance-fault-drill.node-test.mjs scripts/recovery/exclusive-maintenance.node-test.mjs
      - name: Pull the reviewed PostgreSQL 17 image
        timeout-minutes: 6
        run: docker pull supabase/postgres@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
      - name: Check Edge entrypoints and request/provider admission contracts
        timeout-minutes: 4
        run: |
          npx --yes deno@2.5.4 check --config supabase/deno.json supabase/functions/api/index.ts supabase/functions/email-verification-worker/index.ts supabase/functions/google-sheets-worker/index.ts
          npx --yes deno@2.5.4 test --allow-env --allow-read --config supabase/deno.json supabase/functions/_shared/
      - name: Compile the isolated native driver fixture
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          native_dir="$(mktemp -d "${RUNNER_TEMP}/al-native-fixture-XXXXXXXX")"
          echo "MAINTENANCE_NATIVE_FIXTURE_DIR=${native_dir}" >> "$GITHUB_ENV"
          npx --yes deno@2.5.4 compile --frozen --no-prompt --config supabase/deno.json --allow-read=/tmp --allow-write=/tmp --output "${native_dir}/gate-fixture" supabase/functions/_shared/recovery/maintenance.integration.ts
          chmod 755 "${native_dir}/gate-fixture"
      - name: Exercise competing synthetic sessions and backend loss
        timeout-minutes: 5
        run: node scripts/recovery/maintenance-fault-drill.mjs
      - name: Independently check owned-container cleanup
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          containers="$(docker ps -aq --filter label=adaptive-lifting.maintenance-fault=true)"
          test -z "$containers"
      - name: Remove the owned native fixture executable
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MAINTENANCE_NATIVE_FIXTURE_DIR:-}" ]; then
            test "$(dirname -- "$MAINTENANCE_NATIVE_FIXTURE_DIR")" = "$RUNNER_TEMP"
            [[ "$(basename -- "$MAINTENANCE_NATIVE_FIXTURE_DIR")" =~ ^al-native-fixture-[A-Za-z0-9]{8}$ ]]
            test -d "$MAINTENANCE_NATIVE_FIXTURE_DIR" && test ! -L "$MAINTENANCE_NATIVE_FIXTURE_DIR"
            rm -f -- "$MAINTENANCE_NATIVE_FIXTURE_DIR/gate-fixture"
            rmdir -- "$MAINTENANCE_NATIVE_FIXTURE_DIR"
          fi
