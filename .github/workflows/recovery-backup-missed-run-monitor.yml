name: Recovery backup missed-run monitor (prepared)

on:
  schedule:
    # Check three hours after the daily backup schedule, allowing its 90-minute timeout.
    - cron: '17 21 * * *'

# The sole API request is a read of Actions workflow-run history.
permissions:
  actions: read

concurrency:
  group: production-recovery-missed-run-monitor
  cancel-in-progress: false

jobs:
  check-latest-scheduled-success:
    if: >-
      github.event_name == 'schedule' && github.ref_type == 'branch' &&
      vars.RECOVERY_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a recent successful scheduled backup on the default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'schedule'
          test "$GITHUB_REF" = "refs/heads/$GITHUB_REF_NAME"
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          def fail(message):
              raise SystemExit(f"::error::{message}")

          repository = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if not re.fullmatch(r"[^/]+/[^/]+", repository) or not token:
              fail("Required GitHub API context is unavailable.")

          def get_json(path, query=None):
              url = "https://api.github.com" + path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.load(response)
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  fail("Read-only GitHub Actions API request failed.")

          metadata = get_json(f"/repos/{repository}")
          default_branch = metadata.get("default_branch")
          if not isinstance(default_branch, str) or not default_branch:
              fail("Repository default branch could not be read.")
          if os.environ.get("GITHUB_REF") != f"refs/heads/{default_branch}":
              fail("The monitor did not run from the repository default branch.")

          workflow_path = f"/repos/{repository}/actions/workflows/recovery-daily-backup.yml/runs"
          result = get_json(workflow_path, {
              "branch": default_branch,
              "event": "schedule",
              "per_page": 100,
          })
          runs = result.get("workflow_runs")
          if not isinstance(runs, list):
              fail("Scheduled workflow run history is malformed.")
          candidates = [run for run in runs if isinstance(run, dict)
                        and run.get("head_branch") == default_branch
                        and run.get("event") == "schedule"]
          if not candidates:
              fail("No scheduled recovery backup run was found on the default branch.")
          try:
              latest = max(candidates, key=lambda run: datetime.datetime.fromisoformat(
                  run["created_at"].replace("Z", "+00:00")))
              created = datetime.datetime.fromisoformat(latest["created_at"].replace("Z", "+00:00"))
          except (KeyError, TypeError, ValueError):
              fail("Scheduled workflow run timestamps are invalid.")
          now = datetime.datetime.now(datetime.timezone.utc)
          if created < now - datetime.timedelta(hours=26) or created > now + datetime.timedelta(minutes=5):
              fail("The latest scheduled recovery backup run is outside the 26-hour window.")
          if latest.get("status") != "completed" or latest.get("conclusion") != "success":
              fail("The latest scheduled recovery backup workflow did not complete successfully.")
          run_id = latest.get("id")
          if not isinstance(run_id, int) or run_id < 1:
              fail("The latest scheduled recovery backup run identity is invalid.")

          job_result = get_json(f"/repos/{repository}/actions/runs/{run_id}/jobs", {"per_page": 100})
          jobs = job_result.get("jobs")
          if not isinstance(jobs, list):
              fail("Scheduled backup job history is malformed.")
          production_jobs = [job for job in jobs if isinstance(job, dict)
                             and job.get("name") == "Protected production backup"]
          if len(production_jobs) != 1 or production_jobs[0].get("status") != "completed" \
                  or production_jobs[0].get("conclusion") != "success":
              fail("The latest scheduled run has no successful Protected production backup job.")
          print("The latest scheduled run and Protected production backup job succeeded within 26 hours.")
          PY
