name: Backup failure alert

# Emails the operator via the Resend HTTP API when the daily backup workflow
# finishes without success (failure, timeout, cancellation, startup failure).
# Runs as a separate workflow so it still fires when the backup job is killed.

on:
  workflow_run:
    workflows: ['Daily production database backup']
    types: [completed]

permissions: {}

jobs:
  alert:
    # 'skipped' = the backup job's default-branch guard did not match; not a failure.
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-recovery
    steps:
      - name: Email failure alert via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          missing=""
          for v in RESEND_API_KEY ALERT_EMAIL_TO ALERT_EMAIL_FROM; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Backup failure alert skipped; not configured:$missing"
            exit 0
          fi
          subject="[${REPO}] Daily database backup: ${CONCLUSION}"
          text="The daily production database backup did not succeed (conclusion: ${CONCLUSION}, branch: ${RUN_BRANCH}).

          Run: ${RUN_URL}

          Check the run log, fix the cause, then re-run the backup workflow (workflow_dispatch)."
          payload="$(jq -n \
            --arg from "$ALERT_EMAIL_FROM" \
            --arg to "$ALERT_EMAIL_TO" \
            --arg subject "$subject" \
            --arg text "$text" \
            '{from: $from, to: ($to | split(",") | map(gsub("^\\s+|\\s+$"; ""))), subject: $subject, text: $text}')"
          resp="$(mktemp)"
          code="$(curl -sS -o "$resp" -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-all-errors \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::Resend returned HTTP $code"
            cat "$resp" || true
            exit 1
          fi
          echo "Failure alert sent (HTTP $code)."
